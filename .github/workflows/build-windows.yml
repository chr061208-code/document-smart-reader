name: build-windows

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        shell: powershell
        run: ./desktop/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentSmartReader-Windows
          path: dist/DocumentSmartReader.exe
      - name: Attach executable to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/DocumentSmartReader.exe --clobber
